# ===========================================================================
# mock-nginx.conf -- OpenResty-based mock OpenAI-compatible backend.
#
# Runs from the ALREADY-PRESENT openresty/openresty:alpine image, so no extra
# image needs to be pulled. Implements just enough to validate the gateway:
#   * GET  /health                                   -> 200 OK
#   * POST /v1/chat/completions
#       - first MOCK_429_COUNT requests return 429 (to test transparent retry)
#       - stream=true  -> SSE chunks, then data: [DONE]
#       - stream=false -> JSON completion
#
# Tunables (env): MOCK_429_COUNT, MOCK_CHUNK_DELAY, MOCK_CHUNKS
# ===========================================================================

worker_processes  1;
error_log         /dev/stdout warn;

events {
    worker_connections  1024;
}

http {
    lua_shared_dict mock_state 10m;
    client_body_buffer_size 128k;

    init_by_lua_block {
        MOCK_429_COUNT   = tonumber(os.getenv("MOCK_429_COUNT")   or "0")
        MOCK_CHUNK_DELAY = tonumber(os.getenv("MOCK_CHUNK_DELAY") or "0.15")
        MOCK_CHUNKS      = tonumber(os.getenv("MOCK_CHUNKS")      or "5")
        MOCK_RESPONSE_DELAY = tonumber(os.getenv("MOCK_RESPONSE_DELAY") or "0.5")
    }

    server {
        listen 13000;
        server_name _;

        location = /health {
            default_type text/plain;
            content_by_lua_block { ngx.say("OK") }
        }

        location = /mock/reset {
            content_by_lua_block {
                ngx.shared.mock_state:flush_all()
                ngx.say('{"ok":true}')
            }
        }

        location = /mock/metrics {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson"
                local state = ngx.shared.mock_state
                local error_at = state:get("cooldown_error_at")
                local after_at = state:get("cooldown_after_at")
                ngx.say(cjson.encode({
                    max_inflight = state:get("max_inflight") or 0,
                    cooldown_gap = error_at and after_at and (after_at - error_at)
                        or cjson.null,
                    persistent_error_count = state:get("persistent_error_count") or 0,
                    retry_status_calls = cjson.decode(state:get("retry_status_calls") or "{}"),
                }))
            }
        }

        location /v1/chat/completions {
            content_by_lua_block {
                local cjson = require "cjson"

                ngx.req.read_body()
                local ok, payload = pcall(cjson.decode, ngx.req.get_body_data() or "{}")
                local model = ok and payload.model or "unknown"
                local state = ngx.shared.mock_state
                local inflight = state:incr("inflight", 1, 0)
                local maximum = state:get("max_inflight") or 0
                if inflight > maximum then
                    state:set("max_inflight", inflight)
                end

                local failure_mode, failure_code = model:match("^status%-(%a+)%-(%d+)")
                if failure_code then
                    local counts = cjson.decode(state:get("retry_status_calls") or "{}")
                    counts[model] = (counts[model] or 0) + 1
                    state:set("retry_status_calls", cjson.encode(counts))
                    local body = ngx.req.get_body_data()
                    local body_file = ngx.req.get_body_file()
                    if not body and body_file then
                        local file = assert(io.open(body_file, "rb"))
                        body = file:read("*a")
                        file:close()
                    end
                    local signature = ngx.md5(body or "")
                    local original = state:get("body:" .. model)
                    if ngx.req.get_method() ~= "POST"
                        or ngx.req.get_headers()["Authorization"] ~= "Bearer mock-test"
                        or (original and original ~= signature) then
                        state:incr("inflight", -1)
                        ngx.status = 400
                        ngx.say('{"error":"request changed on retry"}')
                        return
                    end
                    state:set("body:" .. model, signature)
                    if failure_mode == "persistent" or counts[model] == 1 then
                        state:incr("inflight", -1)
                        ngx.status = tonumber(failure_code)
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say('{"error":{"message":"injected upstream failure"}}')
                        return
                    end
                end

                if model == "cooldown-model" then
                    local count = state:incr("cooldown_count", 1, 0)
                    if count == 1 then
                        ngx.sleep(0.1)
                        state:set("cooldown_error_at", ngx.now())
                        state:incr("inflight", -1)
                        ngx.status = 503
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({error = {message = "mock unavailable"}}))
                        return
                    end
                    if count > 5 and not state:get("cooldown_after_at") then
                        state:set("cooldown_after_at", ngx.now())
                    end
                    ngx.sleep(1)
                elseif model == "persistent-error-model"
                    or model == "persistent-large-error-model" then
                    state:incr("persistent_error_count", 1, 0)
                    state:incr("inflight", -1)
                    ngx.status = 503
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({error = {message = "persistent unavailable"}}))
                    return
                else
                    ngx.sleep(MOCK_RESPONSE_DELAY or 0.5)
                end

                -- Emit initial 429s only for the dedicated retry model.
                local n = 0
                if model == "retry-model" then
                    n = ngx.shared.mock_state:incr("c429", 1, 0)
                end
                if model == "retry-model" and n <= (MOCK_429_COUNT or 0) then
                    state:incr("inflight", -1)
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({
                        error = {
                            type = "rate_limit_error",
                            message = "mock upstream rate limited"
                        }
                    }))
                    return
                end

                local stream = ok and payload.stream

                if stream then
                    ngx.header["Content-Type"]  = "text/event-stream"
                    ngx.header["Cache-Control"] = "no-cache"
                    ngx.header["Connection"]    = "keep-alive"
                    for i = 1, (MOCK_CHUNKS or 5) do
                        local chunk = {
                            id = "chatcmpl-mock",
                            object = "chat.completion.chunk",
                            choices = {{
                                index = 0,
                                delta = { content = "token-" .. i .. " " },
                                finish_reason = nil
                            }}
                        }
                        ngx.say("data: " .. cjson.encode(chunk))
                        ngx.say("")
                        ngx.flush(true)
                        ngx.sleep(MOCK_CHUNK_DELAY or 0.15)
                    end
                    ngx.say("data: [DONE]")
                    ngx.say("")
                    ngx.flush(true)
                else
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({
                        id = "chatcmpl-mock",
                        object = "chat.completion",
                        choices = {{
                            index = 0,
                            message = {
                                role = "assistant",
                                content = "hello from mock backend (non-stream)"
                            },
                            finish_reason = "stop"
                        }}
                    }))
                end
                state:incr("inflight", -1)
            }
        }

        location / {
            default_type application/json;
            content_by_lua_block { ngx.say('{"echo":"ok"}') }
        }
    }
}
