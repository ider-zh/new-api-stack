# ===========================================================================
# mock-nginx.conf -- OpenResty-based mock OpenAI-compatible backend.
#
# Runs from the ALREADY-PRESENT openresty/openresty:alpine image, so no extra
# image needs to be pulled. Implements just enough to validate the gateway:
#   * GET  /health                                   -> 200 OK
#   * POST /v1/chat/completions
#       - first MOCK_429_COUNT requests return 429 (to test transparent retry)
#       - stream=true  -> SSE chunks, then data: [DONE]
#       - stream=false -> JSON completion
#
# Tunables (env): MOCK_429_COUNT, MOCK_CHUNK_DELAY, MOCK_CHUNKS
# ===========================================================================

worker_processes  1;
error_log         /dev/stdout warn;

events {
    worker_connections  1024;
}

http {
    lua_shared_dict mock_state 10m;

    init_by_lua_block {
        MOCK_429_COUNT   = tonumber(os.getenv("MOCK_429_COUNT")   or "0")
        MOCK_CHUNK_DELAY = tonumber(os.getenv("MOCK_CHUNK_DELAY") or "0.15")
        MOCK_CHUNKS      = tonumber(os.getenv("MOCK_CHUNKS")      or "5")
    }

    server {
        listen 13000;
        server_name _;

        location = /health {
            default_type text/plain;
            content_by_lua_block { ngx.say("OK") }
        }

        location /v1/chat/completions {
            content_by_lua_block {
                local cjson = require "cjson"

                -- Emit MOCK_429_COUNT initial 429s to exercise retry logic.
                local n = ngx.shared.mock_state:incr("c429", 1, 0)
                if n <= (MOCK_429_COUNT or 0) then
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({
                        error = {
                            type = "rate_limit_error",
                            message = "mock upstream rate limited"
                        }
                    }))
                    return
                end

                ngx.req.read_body()
                local ok, payload = pcall(cjson.decode, ngx.req.get_body_data() or "{}")
                local stream = ok and payload.stream

                if stream then
                    ngx.header["Content-Type"]  = "text/event-stream"
                    ngx.header["Cache-Control"] = "no-cache"
                    ngx.header["Connection"]    = "keep-alive"
                    for i = 1, (MOCK_CHUNKS or 5) do
                        local chunk = {
                            id = "chatcmpl-mock",
                            object = "chat.completion.chunk",
                            choices = {{
                                index = 0,
                                delta = { content = "token-" .. i .. " " },
                                finish_reason = nil
                            }}
                        }
                        ngx.say("data: " .. cjson.encode(chunk))
                        ngx.say("")
                        ngx.flush(true)
                        ngx.sleep(MOCK_CHUNK_DELAY or 0.15)
                    end
                    ngx.say("data: [DONE]")
                    ngx.say("")
                    ngx.flush(true)
                else
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({
                        id = "chatcmpl-mock",
                        object = "chat.completion",
                        choices = {{
                            index = 0,
                            message = {
                                role = "assistant",
                                content = "hello from mock backend (non-stream)"
                            },
                            finish_reason = "stop"
                        }}
                    }))
                end
            }
        }

        location / {
            default_type application/json;
            content_by_lua_block { ngx.say('{"echo":"ok"}') }
        }
    }
}
