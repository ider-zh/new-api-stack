# ===========================================================================
# OpenResty AI gateway -- production deployment descriptor.
#
# Deploys the gateway in front of the existing new-api service. The gateway
# attaches to the SAME external `web` network that new-api uses, so it can
# reach it as `new-api:3000` via Docker DNS.
#
# Every tunable is overridable through the environment, e.g.:
#   NEW_API_UPSTREAM=new-api:3000 PORT=8080 RPM_CAPACITY=25 \
#   GATEWAY_HOST_PORT=30082 docker compose up -d
# ===========================================================================

services:
  gateway:
    image: openresty/openresty:alpine
    container_name: openresty-ai-gateway
    restart: unless-stopped

    # Replace the stock entrypoint with our renderer (PORT -> listen port).
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

    environment:
      # Where new-api lives (host:port inside the Docker network).
      - NEW_API_UPSTREAM=${NEW_API_UPSTREAM:-new-api:3000}
      # Container listen port (consumed by the entrypoint).
      - PORT=${PORT:-8080}
      # Token-bucket RPM limit.
      - RPM_CAPACITY=${RPM_CAPACITY:-25}
      - RPM_WINDOW_SECONDS=${RPM_WINDOW_SECONDS:-60}
      # Transparent 429 retry policy.
      - MAX_429_RETRIES=${MAX_429_RETRIES:-5}
      - RETRY_BACKOFF_SECONDS=${RETRY_BACKOFF_SECONDS:-1}

    ports:
      - "${GATEWAY_HOST_PORT:-30082}:8080"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./lua:/etc/nginx/lua:ro
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro

    networks:
      - web

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
