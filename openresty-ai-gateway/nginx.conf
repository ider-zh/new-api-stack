# ===========================================================================
# nginx.conf  --  OpenResty AI gateway
#
# Layer placed in front of new-api. Responsibilities:
#   * Reverse proxy (HTTP + SSE streaming passthrough, unbuffered)
#   * Global RPM control via a token bucket (queues instead of 429)
#   * Bounded retry on upstream HTTP 429/500/502/503/504
#   * /health endpoint and structured JSON access log
#
# Upstream host/port is read from NEW_API_UPSTREAM (Lua, runtime resolver).
# Listen port is the LISTEN_PORT placeholder, substituted by the entrypoint
# from the PORT environment variable.
# ===========================================================================

worker_processes  auto;
error_log         /dev/stdout warn;

events {
    worker_connections  1024;
}

http {
    # Allow error_page to re-trigger itself, so @retry can loop (bounded by the
    # Lua retry counter) until the upstream recovers or the retry budget is exhausted.
    recursive_error_pages on;

    # Only the Lua-managed retry path may replay a request. Once headers or
    # SSE data have reached the client, a failed stream must not be replayed.
    proxy_next_upstream off;

    # Shared memory for the token bucket and 429-retry counters.
    lua_shared_dict gateway 10m;

    # Make our Lua modules (config.lua, rate_limit.lua) require()-able.
    lua_package_path '/etc/nginx/lua/?.lua;;';

    # Docker embedded DNS so variable-based upstream hosts resolve at runtime.
    resolver           127.0.0.11 valid=5s ipv6=off;
    resolver_timeout   5s;

    # ---- Structured JSON access log -----------------------------------------
    log_format gateway_json escape=json
        '{'
        '"time":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"queue_wait_ms":$queue_wait_ms,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"bytes":$body_bytes_sent'
        '}';

    access_log  /dev/stdout gateway_json;

    # Allow large request bodies (e.g. long prompts) without 413.
    client_max_body_size 50m;

    server {
        listen LISTEN_PORT;
        server_name _;

        # Upstream target, loaded from the env file generated by the entrypoint
        # (this OpenResty build's LuaJIT os.getenv returns nil, so we read a
        # generated Lua table instead). Resolved at request time by the Docker
        # embedded DNS resolver.
        set_by_lua_block $gateway_upstream {
            local c = require "config"
            return c.upstream
        }

        # Queue wait time (ms) recorded by the rate limiter; default 0.
        set $queue_wait_ms "0";

        # Release the concurrency slot once at final request completion,
        # including upstream errors and client disconnects.
        log_by_lua_block {
            local rl = require "rate_limit"
            rl.finish_request()
        }

        # ---------------------------------------------------------------------
        # Health check
        # ---------------------------------------------------------------------
        location = /health {
            default_type text/plain;
            return 200 'OK';
        }

        # ---------------------------------------------------------------------
        # Main proxy: rate-limit (queue) -> upstream.
        # Retryable upstream errors before response headers go through @retry.
        # ---------------------------------------------------------------------
        location / {
            # RPM gate. May ngx.sleep() here when the bucket is empty, which is
            # exactly the desired queueing behaviour (no 429 to the client).
            access_by_lua_block {
                local rl = require "rate_limit"
                local wait_ms, err = rl.acquire_request()
                if not wait_ms then
                    ngx.log(ngx.ERR, "gateway admission failed: ", err)
                    return ngx.exit(504)
                end
                ngx.var.queue_wait_ms = tostring(math.floor(wait_ms))
            }

            proxy_intercept_errors on;     # enable error_page handling
            error_page 429 500 502 503 504 = @retry;   # shared cooldown + transparent retry

            # --- SSE / streaming safe settings (no buffering, long timeout) ---
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;

            proxy_set_header Host              $gateway_upstream;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_set_header X-Gateway-Retry "";
            proxy_set_header X-Gateway-Model "";
            proxy_set_header X-Gateway-Admission "";
            proxy_set_header X-Gateway-Slot "";
            proxy_set_header X-Gateway-Ready-At "";

            proxy_pass http://$gateway_upstream;
        }

        # ---------------------------------------------------------------------
        # Retryable HTTP error target. Re-proxies to upstream; counts attempts and applies
        # adaptive same-model backoff. When retries are exhausted it returns
        # the final upstream status without issuing another upstream request.
        # ---------------------------------------------------------------------
        location @retry {
            access_by_lua_block {
                local rl = require "rate_limit"
                local ok, status = rl.handle_http_error_retry()
                if not ok then
                    ngx.req.set_header(
                        "X-Gateway-Final-Status",
                        tostring(status or 503)
                    )
                    return ngx.exec("@giveup")
                end
            }

            proxy_intercept_errors on;
            error_page 429 500 502 503 504 = @retry;       # bounded self-loop

            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;

            proxy_set_header Host              $gateway_upstream;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_set_header X-Gateway-Retry "";
            proxy_set_header X-Gateway-Model "";
            proxy_set_header X-Gateway-Admission "";
            proxy_set_header X-Gateway-Slot "";
            proxy_set_header X-Gateway-Ready-At "";

            proxy_pass http://$gateway_upstream;
        }

        # ---------------------------------------------------------------------
        # Terminal error response. It does not proxy again, so exhausting the
        # retry budget cannot add a hidden extra upstream request.
        # ---------------------------------------------------------------------
        location @giveup {
            default_type application/json;
            content_by_lua_block {
                local status = tonumber(
                    ngx.req.get_headers()["X-Gateway-Final-Status"]
                ) or 503
                ngx.status = status
                ngx.say('{"error":{"message":"upstream unavailable after gateway retry"}}')
                return ngx.exit(status)
            }
        }

        # ---------------------------------------------------------------------
    }
}
